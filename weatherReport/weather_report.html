<!DOCTYPE html>
<html>
<head>
  <title>Weather Report</title>
</head>
<body>
   <h1>Weather Report</h1>

  <form id="weatherCityForm">
    <label for="city">Enter City:</label>
    <input type="text" id="city" name="city">
    <button type="submit">Get Weather</button>
  </form>

  <div id="weatherCityInfo"></div>

  <form id="weatherLatLonForm">
    <label for="lat">Enter Latitude:</label>
    <input type="number" id="lat" name="latitude" min="-90" max="90">
    <label for="lon">Enter Longitude:</label>
    <input type="number" id="lon" name="longitude" min="-180" max="180">
    <button type="submit">Get Weather</button>
  </form>

  <div id="weatherLatLonInfo"></div>
<script src="./weather_report.js"></script>
</body>
</html>
